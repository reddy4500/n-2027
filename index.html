  <style>
:root {
  /* High-Performance Modern Light Theme */
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --border: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --primary: #4f46e5;
  --primary-2: #6366f1;
  --primary-soft: rgba(79, 70, 229, 0.1);
  --ok: #16a34a;
  --ok-soft: rgba(22, 163, 74, 0.1);
  --bad: #dc2626;
  --bad-soft: rgba(220, 38, 38, 0.1);
  --warn: #d97706;
  --warn-soft: rgba(217, 119, 6, 0.1);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  --radius: 12px;
  --font: "Inter", "Noto Sans Telugu", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    /* High-Performance Modern Dark Theme */
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #334155;
    --border: #475569;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #0ea5e9;
    --primary-2: #38bdf8;
    --primary-soft: rgba(14, 165, 233, 0.15);
    --ok: #10b981;
    --ok-soft: rgba(16, 185, 129, 0.15);
    --bad: #ef4444;
    --bad-soft: rgba(239, 68, 68, 0.15);
    --warn: #f59e0b;
    --warn-soft: rgba(245, 158, 11, 0.15);
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
  }
}
:root[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-2: #334155;
  --border: #475569;
  --text: #f8fafc;
  --muted: #94a3b8;
  --primary: #0ea5e9;
  --primary-2: #38bdf8;
  --primary-soft: rgba(14, 165, 233, 0.15);
  --ok: #10b981;
  --ok-soft: rgba(16, 185, 129, 0.15);
  --bad: #ef4444;
  --bad-soft: rgba(239, 68, 68, 0.15);
  --warn: #f59e0b;
  --warn-soft: rgba(245, 158, 11, 0.15);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: .4rem 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hidden { display: none !important; }

.app { display: flex; min-height: 100vh; }
.sidebar { width: 232px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 18px; }
.brand strong { display: block; font-size: 1.05rem; }
.brand span { display: block; font-size: .8rem; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--text); text-decoration: none; font-weight: 500; transition: background 0.15s ease; }
.nav a:hover { background: var(--surface-2); }
.nav a.active { background: var(--primary-soft); color: var(--primary); }
.nav svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-foot { margin-top: auto; font-size: .8rem; color: var(--muted); padding: 8px; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 24px; background: var(--bg); border-bottom: 1px solid var(--border); }
.topbar-title { font-weight: 700; font-size: 1.1rem; }
.topbar-right { display: flex; gap: 6px; }
.pill { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); white-space: nowrap; }
.pill:empty { display: none; }
.pill.install { cursor: pointer; background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; font-family: inherit; }
.pill[hidden] { display: none; }
.offline-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-right: 6px; }
.view { padding: 22px 24px 120px; max-width: 1080px; width: 100%; margin: 0 auto; outline: none; }

.bottom-nav { display: none; }
@media (max-width: 820px) {
  .sidebar { display: none; }
  .topbar { padding: 10px 16px; }
  .view { padding: 16px 16px 140px; }
  .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--border); overflow-x: auto; padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); scrollbar-width: none; }
  .bottom-nav a { flex: 1 0 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; padding: 6px 2px; color: var(--muted); text-decoration: none; border-radius: 8px; }
  .bottom-nav a.active { color: var(--primary); }
  .bottom-nav svg { width: 20px; height: 20px; }
}

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 820px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .g2 { grid-template-columns: 1fr; } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card + .card { margin-top: 14px; }
.grid > .card + .card { margin-top: 0; }
.section { margin-top: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.card-head h3 { margin: 0; }
.stat .label { font-size: .8rem; color: var(--muted); }
.stat .value { font-size: 1.6rem; font-weight: 700; }
.stat .sub { font-size: .78rem; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: .92rem; text-decoration: none; color: var(--text); transition: background 0.15s ease; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #020617; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #020617; } }
.btn.primary:hover { filter: brightness(1.1); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: .82rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }

label.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 500; }
input[type=text], input[type=password], input[type=date], input[type=time], input[type=number], select, textarea {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; width: 100%; color: var(--text);
}
textarea { resize: vertical; min-height: 70px; }
input:focus, select:focus, textarea:focus, .btn:focus-visible { outline: 2px solid var(--primary-2); outline-offset: 1px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }

.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.bar.ok > i { background: var(--ok); } .bar.bad > i { background: var(--bad); } .bar.warn > i { background: var(--warn); }
.subj-row { display: grid; grid-template-columns: 130px 1fr 52px; gap: 10px; align-items: center; font-size: .86rem; padding: 4px 0; }
.subj-row span:last-child { text-align: right; color: var(--muted); }

.tag { display: inline-block; font-size: .74rem; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); margin-right: 4px; }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.p { background: var(--primary-soft); color: var(--primary); }

/* Quiz */
.q-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.q-stem { font-size: 1.05rem; font-weight: 500; white-space: pre-wrap; }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 11px; background: var(--surface); cursor: pointer; width: 100%; transition: border-color 0.15s ease; }
.opt:hover:not(:disabled) { border-color: var(--primary-2); }
.opt b { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: .82rem; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.explain { border-left: 3px solid var(--primary); background: var(--surface-2); padding: 12px 14px; border-radius: 0 10px 10px 0; margin-top: 10px; }
.pearl { margin-top: 8px; font-weight: 600; color: var(--primary); }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; max-height: 260px; overflow: auto; }
.palette button { height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: .8rem; }
.palette button.ans { background: var(--primary); color: #fff; border-color: var(--primary); }
:root[data-theme="dark"] .palette button.ans { color: #020617; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .palette button.ans { color: #020617; } }
.palette button.mark { box-shadow: inset 0 0 0 2px var(--warn); }
.palette button.cur { outline: 2px solid var(--text); }
.palette button:disabled { opacity: .35; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; }
.timer.low { color: var(--bad); }

/* Chat */
.chat { display: flex; flex-direction: column; height: calc(100vh - 210px); min-height: 420px; }
@media (max-width: 820px) { .chat { height: calc(100vh - 250px); } }
.msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 12px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
:root[data-theme="dark"] .msg.user { color: #020617; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .msg.user { color: #020617; } }
.msg.model { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg p:first-child { margin-top: 0; } .msg p:last-child { margin-bottom: 0; }
.msg ul, .msg ol { margin: .3rem 0; padding-left: 1.2rem; }
.composer { display: flex; gap: 8px; align-items: flex-end; padding-top: 10px; border-top: 1px solid var(--border); }
.composer textarea { min-height: 44px; max-height: 140px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: .8rem; cursor: pointer; }
.chip:hover { border-color: var(--primary-2); }
.typing { display: inline-flex; gap: 4px; } .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }

/* Flashcards */
.flash { perspective: 1000px; min-height: 220px; cursor: pointer; }
.flash-inner { position: relative; min-height: 220px; transition: transform .45s; transform-style: preserve-3d; }
.flash.flipped .flash-inner { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; text-align: center; padding: 22px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); font-size: 1.08rem; overflow: auto; }
.flash-face.back { transform: rotateY(180deg); background: var(--primary-soft); }

.tasks { list-style: none; padding: 0; margin: 0; }
.tasks li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--border); }
.tasks li:last-child { border-bottom: 0; }
.tasks li.done span { text-decoration: line-through; color: var(--muted); }
.tasks input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--primary); }

table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 600; font-size: .8rem; }
.table-wrap { overflow-x: auto; }

.pomo { font-size: 3rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: .88rem; margin-bottom: 14px; }
.notice a { color: inherit; font-weight: 600; }
.loader { display: inline-block; width: 18px; height: 18px; border: 2.5px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.center { text-align: center; }
details summary { cursor: pointer; font-weight: 600; }
kbd { background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; font-size: .8rem; }
.hero { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border: 0; }
:root[data-theme="dark"] .hero { color: #020617; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { color: #020617; } }
.hero .muted { color: inherit; opacity: 0.85; }
.hero .btn { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.3); color: inherit; }
:root[data-theme="dark"] .hero .btn { background: rgba(0,0,0,.1); border-color: rgba(0,0,0,.2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero .btn { background: rgba(0,0,0,.1); border-color: rgba(0,0,0,.2); } }
.hero .btn:hover { background: rgba(255,255,255,.25); }
:root[data-theme="dark"] .hero .btn:hover { background: rgba(0,0,0,.2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero .btn:hover { background: rgba(0,0,0,.2); } }

/* Voice */
.mic-fab { position: fixed; right: 20px; bottom: 24px; z-index: 30; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 20px var(--primary-soft); transition: transform 0.2s; }
:root[data-theme="dark"] .mic-fab { color: #020617; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mic-fab { color: #020617; } }
.mic-fab:active { transform: scale(0.95); }
.mic-fab.on { background: var(--bad); color: #fff; animation: pulse 1.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.5) } 70% { box-shadow: 0 0 0 16px rgba(239,68,68,0) } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0) } }
@media (max-width: 820px) { .mic-fab { bottom: calc(76px + env(safe-area-inset-bottom)); right: 14px; width: 52px; height: 52px; } }
.voice-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 30; background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: .9rem; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); }
.voice-bar .dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; animation: blink 1s infinite; flex-shrink: 0; }
@media (max-width: 820px) { .voice-bar { bottom: 140px; } }
.voice-bar[hidden] { display: none; }
.toasts { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100% - 32px)); }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: .9rem; box-shadow: var(--shadow); animation: slide .2s ease-out; }
.toast.bad { background: var(--bad); color: #fff; } .toast.ok { background: var(--ok); color: #fff; }
@keyframes slide { from { opacity: 0; transform: translateY(-8px) } }

  </style>
</head>
<body>
  <div class="app">

    if (has("read", "repeat", "\u0C1A\u0C26\u0C41\u0C35\u0C41", "\u0C2E\u0C33\u0C4D\u0C33\u0C40", "\u0C2E\u0C33\u0C4D\u0C32\u0C40")) {
      quizVoice({ type: "read" });
      return "Reading";
    }
    if (has("submit", "\u0C38\u0C2C\u0C4D\u0C2E\u0C3F\u0C1F\u0C4D")) {
      quizVoice({ type: "submit" });
      return "Submitted";
    }
    if (has("end session", "finish", "\u0C2E\u0C41\u0C17\u0C3F\u0C02\u0C1A\u0C41")) {
      quizVoice({ type: "stop" });
      return "Session ended";
    }
  }
  if (route2 === "cards") {
    if (has("show answer", "flip", "answer", "\u0C1C\u0C35\u0C3E\u0C2C\u0C41")) {
      cardsVoice({ type: "flip" });
      return "Answer";
    }
    const g = has("again", "\u0C2E\u0C33\u0C4D\u0C33\u0C40") ? 0 : has("hard", "\u0C15\u0C37\u0C4D\u0C1F\u0C02") ? 3 : has("easy", "\u0C38\u0C41\u0C32\u0C2D\u0C02") ? 5 : has("good", "\u0C2C\u0C3E\u0C17\u0C41\u0C02\u0C26\u0C3F") ? 4 : null;
    if (g !== null && words.length <= 3) {
      cardsVoice({ type: "grade", q: g });
      return "Graded";
    }
    if (has("read", "\u0C1A\u0C26\u0C41\u0C35\u0C41")) {
      cardsVoice({ type: "read" });
      return "Reading";
    }
  }
  if (has("open", "go to", "show", "\u0C24\u0C46\u0C30\u0C41\u0C35\u0C41", "\u0C1A\u0C42\u0C2A\u0C3F\u0C02\u0C1A\u0C41") || words.length <= 2) {
    for (const [r, keys] of PAGES) if (keys.some((k) => t.includes(k))) {
      go(r);
      return `Opening ${r}`;
    }
  }
  askMentor(raw.trim(), { voice: true });
  return "Asking Pinaka\u2026";
}

      }, 4e3);
      return;
    }
    resetAll(true);
    toast("Progress reset");
    location.reload();
  };

// js/app.js

  home: { title: "Home", icon: "home", render: renderHome },

  mentor: { title: "AI Mentor", icon: "mentor", render: renderMentor },
  cards: { title: "Flashcards", icon: "cards", render: renderCards },
  plan: { title: "Planner", icon: "plan", render: renderPlan },
  settings: { title: "Settings", icon: "settings", render: renderSettings }
};
var view = document.getElementById("view");
function renderNav(active2) {
  const links = Object.entries(ROUTES).map(([k, r]) => `<a href="#/${k}" class="${k === active2 ? "active" : ""}">${icon(r.icon)}<span>${r.title}</span></a>`).join("");
  document.getElementById("nav").innerHTML = links;
  document.getElementById("bottomNav").innerHTML = links;
  document.getElementById("sidebarFoot").innerHTML = S.settings.apiKey ? "AI: Gemini connected" : '<a href="#/settings">Add Gemini key</a> to enable AI';
}
function renderPills() {
  const st = currentStreak(), dl = daysLeft();
  document.getElementById("streakPill").textContent = st ? `${st}-day streak` : "";
  document.getElementById("countdownPill").textContent = dl !== null ? `${dl} days to exam` : "";
}
function route() {
  let r = currentRoute();
  if (!ROUTES[r]) {
    r = "home";
    history.replaceState(null, "", "#/home");
  }
  renderNav(r);
  renderPills();
  document.getElementById("pageTitle").textContent = ROUTES[r].title;
  try {
    ROUTES[r].render(view);
  } catch (e) {
    console.error(e);
    view.innerHTML = `<div class="card"><h3>Something went wrong</h3><p class="muted">${e.message}</p></div>`;
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("settings-changed", () => {
  renderNav(currentRoute());
  renderPills();
});
var fab = document.getElementById("micFab");
var bar = document.getElementById("voiceBar");
var barText = document.getElementById("voiceText");
var hideT;
function showBar(text, keep2 = false) {
  bar.hidden = false;
  barText.textContent = text;
  clearTimeout(hideT);
  if (!keep2) hideT = setTimeout(() => {
    if (!isListening()) bar.hidden = true;
  }, 2500);
}
function onState2(s) {
  if (s.error) {
    toast(s.error, "bad");
    fab.classList.remove("on");
    bar.hidden = true;
    return;
  }
  if (s.on === true) {
    fab.classList.add("on");
    showBar(S.settings.lang === "te" ? "\u0C35\u0C3F\u0C02\u0C1F\u0C41\u0C28\u0C4D\u0C28\u0C3E\u0C28\u0C41\u2026" : "Listening\u2026", true);
  }
  if (s.on === false) {
    fab.classList.remove("on");
    if (!barText.dataset.result) bar.hidden = true;
  }
  if (s.interim) showBar(s.interim, true);
}
function onText2(text) {
  const res = handleCommand(text);
  barText.dataset.result = "1";
  showBar(`\u201C${text}\u201D \u2192 ${res}`);
  setTimeout(() => {
    delete barText.dataset.result;
  }, 2600);
}
function toggleMic() {
  if (!canListen) {
    toast("Voice input needs Chrome or Edge (desktop or Android).", "bad");
    return;
  }
  if (isListening()) stopListening();
  else startListening({ continuous: !!S.settings.handsFree, onText: onText2, onState: onState2 });
}
fab.addEventListener("click", toggleMic);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    stopSpeaking();
    if (isListening()) stopListening();
    return;
  }
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "m") {
    e.preventDefault();
    toggleMic();
    return;
  }
  if (!quizActive()) return;
  if (["1", "2", "3", "4", "a", "b", "c", "d"].includes(k)) {
    e.preventDefault();
    quizVoice({ type: "option", i: "1234".includes(k) ? +k - 1 : "abcd".indexOf(k) });
  } else if (k === "n" || k === "arrowright") {
    e.preventDefault();
    quizVoice({ type: "next" });
  } else if (k === "p" || k === "arrowleft") {
    e.preventDefault();
    quizVoice({ type: "prev" });
  }
});
setInterval(checkReminders, 3e4);
setTimeout(checkReminders, 3e3);
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW registration failed", err));
  navigator.serviceWorker.addEventListener?.("message", (e) => {
    if (e.data?.route) go(e.data.route);
  });
}
var deferredInstall = null;
var installBtn = document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstall = e;
  installBtn.hidden = false;
});
installBtn.addEventListener("click", async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice.catch(() => {
  });
  deferredInstall = null;
  installBtn.hidden = true;
});
window.addEventListener("appinstalled", () => {
  installBtn.hidden = true;
  toast("Installed! Open NEET PG AI from your home screen.", "ok");
});
navigator.storage?.persist?.().catch(() => {
});
window.addEventListener("offline", () => toast("You are offline \u2014 AI features pause; the offline question bank still works.", "bad", 5e3));
window.addEventListener("online", () => toast("Back online \u2014 AI features available again.", "ok"));
applyTheme();
if (!location.hash) history.replaceState(null, "", S.settings.apiKey ? "#/home" : "#/settings");
route();
if (!S.settings.apiKey) setTimeout(() => toast("Welcome! Add your free Gemini API key to unlock the AI agent.", "", 5e3), 400);
